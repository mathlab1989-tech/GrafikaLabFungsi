<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GrafikaLab – Lab Maya Grafik Fungsi</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.8/katex.min.js"></script>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#16202a;--mut:#64707d;--line:#e3dfd3;--acc:#0f766e}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10171c;--card:#18222a;--ink:#e8eef2;--mut:#93a1ad;--line:#2a3742;--acc:#2dd4bf}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.mono{font-family:'Fira Code',monospace}
.tab{padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;background:var(--card);cursor:pointer}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
input[type=range]{width:100%;accent-color:var(--acc)}
canvas{touch-action:none;width:100%;height:100%;display:block}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.row b{font-family:'Fira Code',monospace;font-weight:500;text-align:right}
math{font-family:"STIX Two Math","Cambria Math","Latin Modern Math","Noto Sans Math",serif;font-size:1.12em}
.row b math{font-size:1em}
.hidden{display:none}
.splash{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 30% 20%,#115e59,#0b1a22 70%);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .6s}
.splash.out{opacity:0;pointer-events:none}
.splash h1{font-size:clamp(40px,9vw,72px);font-weight:800;letter-spacing:-1px}.splash h1 span{color:#5eead4}
.draw{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:700;stroke-dashoffset:700;animation:dr 2.8s ease forwards}
.d2{stroke:#fbbf24;animation-delay:.5s}
@keyframes dr{to{stroke-dashoffset:0}}
.lbar{height:8px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden;margin:18px auto 8px;max-width:320px}
.lbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5eead4,#fbbf24);transition:width .15s}
.cta{margin-top:16px;padding:12px 26px;border-radius:99px;background:#5eead4;color:#042f2e;font-weight:800;cursor:pointer;animation:pop .5s}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,15,20,.6);display:flex;align-items:center;justify-content:center;padding:14px}
.modal>div{max-height:88vh;overflow:auto;max-width:640px;width:100%;padding:22px}
.mt{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.mt small{display:block;color:var(--mut);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.q{padding:14px;margin-bottom:10px}.q label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:14px}
.q label:hover{background:var(--bg)}.good{background:rgba(22,163,74,.15)!important}.bad{background:rgba(220,38,38,.15)!important}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);font:inherit}
.na{color:var(--mut);font-style:italic;font-size:11px}
#twt td{padding:3px 12px;text-align:right}#twt tr:hover,#twt tr.sel{background:rgba(37,99,235,.16)}
#tw input,#tw select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:1px 3px;font-size:12px}
</style>
</head>
<body class="min-h-screen">
<div class="max-w-7xl mx-auto p-3 md:p-5">
 <header class="flex flex-wrap items-center justify-between gap-2 mb-3">
  <div><h1 class="text-xl md:text-2xl font-extrabold">Grafika<span style="color:var(--acc)">Lab</span></h1>
  <p class="text-xs" style="color:var(--mut)">Lab Maya Grafik Fungsi · bentuk transformasi a, h, k</p></div>
  <div class="flex gap-2 items-center"><div id="modes" class="flex gap-2"></div><button id="fs" class="tab" title="Layar penuh">⛶</button><button id="info" class="tab">ⓘ Info</button></div>
 </header>
 <nav id="nav" class="flex gap-2 mb-3 overflow-x-auto"></nav>
 <section id="v-lab">
 <div id="types" class="flex flex-wrap gap-2 mb-3"></div>
 <div class="grid lg:grid-cols-[280px_1fr_300px] gap-3">
  <aside class="card p-4 order-2 lg:order-1">
   <div class="mb-3"><div id="l1" class="text-[11px] font-semibold hidden" style="color:var(--mut)">Bentuk puncak</div>
   <div class="mono text-center text-base font-semibold p-2 rounded-lg cursor-pointer" id="eq" style="background:var(--bg)" title="Klik untuk melihat parameter mentah"></div>
   <div id="eqraw" class="hidden text-xs mt-1 mono" style="color:var(--mut)"></div>
   <div id="l2" class="text-[11px] font-semibold mt-2 hidden" style="color:var(--mut)">Bentuk standar</div>
   <div class="mono text-center text-base font-semibold p-2 rounded-lg hidden" id="eq2" style="background:var(--bg)"></div>
   <div id="eqmode" class="hidden flex gap-1 justify-center mt-2"></div>
   <div id="ratmode" class="hidden flex gap-1 justify-center mt-2 flex-wrap"></div><div id="ratcap" class="hidden text-xs text-center mt-1" style="color:var(--mut)"></div></div>
   <div id="sliders" class="space-y-3"></div>
   <div class="mt-4 space-y-2 text-sm">
    <label class="flex gap-2 items-center"><input type="checkbox" id="tGhost" checked> Ghost graph (fungsi induk)</label>
    <label class="flex gap-2 items-center"><input type="checkbox" id="tAsym" checked> Tampilkan asimtot / sumbu simetri</label>
    <label class="flex gap-2 items-center"><input type="checkbox" id="tDom" checked> Sorot area di luar domain</label>
    <label class="flex gap-2 items-center hidden" id="invWrap"><input type="checkbox" id="tInv"> Mode invers (cermin y = x)</label>
   </div>
   <button id="reset" class="tab mt-4 w-full text-center">Reset parameter</button>
   <div id="modeBox" class="mt-4 text-sm"></div>
  </aside>
  <main class="card order-1 lg:order-2 relative overflow-hidden" style="height:min(70vh,560px);min-height:340px">
   <canvas id="cv"></canvas>
   <div class="absolute bottom-2 left-3 text-[11px]" style="color:var(--mut)">Geser = pan · roda/cubit = zoom</div>
   <button id="home" class="tab absolute top-2 right-2">⌂ Pusat</button>
   <button id="tbtn" class="tab absolute top-2 left-2" title="Tabel nilai">⊞ Tabel</button>
  </main>
  <aside class="card p-4 order-3">
   <h2 class="font-extrabold text-sm mb-2">Analisis Karakteristik</h2>
   <div id="analysis"></div>
   <div id="shift" class="mt-3 text-sm p-3 rounded-lg" style="background:var(--bg)"></div>
  </aside>
 </div>
 </section>
 <section id="v-materi" class="hidden"></section>
 <section id="v-evaluasi" class="hidden"></section>
 <section id="v-refleksi" class="hidden"></section>
</div>
<div id="tw" class="card hidden" style="position:fixed;z-index:30;width:min(250px,92vw);left:8px;top:120px;box-shadow:0 10px 30px rgba(0,0,0,.25)">
 <div id="twh" class="flex justify-between items-center px-3 py-2" style="cursor:move;touch-action:none;border-bottom:1px solid var(--line)"><b class="text-sm">Tabel Nilai <span data-tex="f(x)"></span></b><span class="flex gap-1"><button id="twmin" class="tab" style="padding:0 8px">–</button><button id="twx" class="tab" style="padding:0 8px">✕</button></span></div>
 <div id="twb"><div class="flex flex-wrap gap-1 p-2 text-xs items-center">step <select id="tstep"><option value="1">1</option><option value="0.5">0,5</option><option value="0.1">0,1</option></select> <span data-tex="x"></span>: <input id="tfrom" type="number" value="-5" style="width:52px"> s.d. <input id="tto" type="number" value="5" style="width:52px"></div>
  <div class="mono text-xs font-bold flex justify-around py-1" style="background:var(--bg)"><span data-tex="x"></span><span data-tex="y=f(x)"></span></div>
  <div id="twt" style="max-height:min(300px,45vh);overflow:auto"></div></div></div>
<div id="modal" class="modal hidden"><div class="card" id="mbody"></div></div>
<div id="splash" class="splash"><div>
 <svg viewBox="0 0 400 140" width="320" style="margin:0 auto 10px;display:block"><path d="M0 70H400M200 0V140" stroke="rgba(255,255,255,.25)" fill="none"/><path class="draw" stroke="#5eead4" d="M20 125Q110 -45 200 70T380 15"/><path class="draw d2" d="M20 25C120 25 160 70 200 108S320 122 380 120"/></svg>
 <h1>Grafika<span>Lab</span></h1>
 <p style="opacity:.8;margin-top:6px">Lab Maya Penjelajah Grafik Fungsi</p>
 <div class="lbar"><i id="lb"></i></div><p id="lt" class="mono" style="font-size:12px;opacity:.8">Memuat… 0%</p>
 <button id="go" class="cta hidden">Mulai Eksplorasi Lab Maya →</button>
 <p style="margin-top:30px;font-size:12px;opacity:.6">Dikembangkan oleh I Made Agus Suputrayasa</p>
</div></div>
<script>
const $=id=>document.getElementById(id);
const fmt=v=>{if(!isFinite(v))return'—';const r=Math.round(v*100)/100;return(Object.is(r,-0)?0:r).toString().replace('.',',')};
const lg=(x,b)=>Math.log(x)/Math.log(b);
const T={
 quad:{n:'Kuadrat',b:0,f:(x,p)=>p.a*(x-p.h)**2+p.k,eq:p=>`f(x) = ${fmt(p.a)}(x ${s(-p.h)})² ${s(p.k)}`},
 abs:{n:'Nilai Mutlak',b:0,f:(x,p)=>p.a*Math.abs(x-p.h)+p.k,eq:p=>`f(x) = ${fmt(p.a)}|x ${s(-p.h)}| ${s(p.k)}`},
 rat:{n:'Rasional',b:0,f:(x,p)=>ratForm==='gen'?(p.ga*x+p.gb)/(p.gc*x+p.gd):ratForm==='adv'?(p.qa*x*x+p.qb*x+p.qc)/(p.qp*x+p.qq):p.a/(x-p.h)+p.k,eq:p=>ratForm==='gen'?`f(x) = (${fmt(p.ga)}x ${s(p.gb)}) / (${fmt(p.gc)}x ${s(p.gd)})`:ratForm==='adv'?`f(x) = (${fmt(p.qa)}x² ${s(p.qb)}x ${s(p.qc)}) / (${fmt(p.qp)}x ${s(p.qq)})`:`f(x) = ${fmt(p.a)}/(x ${s(-p.h)}) ${s(p.k)}`},
 irr:{n:'Irasional',b:0,f:(x,p)=>p.a*Math.sqrt(x-p.h)+p.k,eq:p=>`f(x) = ${fmt(p.a)}√(x ${s(-p.h)}) ${s(p.k)}`},
 exp:{n:'Eksponen',b:1,f:(x,p)=>p.a*Math.pow(p.b,x-p.h)+p.k,eq:p=>`f(x) = ${fmt(p.a)}·${fmt(p.b)}^(x ${s(-p.h)}) ${s(p.k)}`},
 log:{n:'Logaritma',b:1,f:(x,p)=>p.a*lg(x-p.h,p.b)+p.k,eq:p=>`f(x) = ${fmt(p.a)}·log${fmt(p.b)}(x ${s(-p.h)}) ${s(p.k)}`}
};
function s(v){return(v<0?'− ':'+ ')+fmt(Math.abs(v))}
const D={a:1,h:0,k:0,b:2,ga:0,gb:1,gc:1,gd:0,qa:1,qb:0,qc:1,qp:1,qq:0};
let type='quad',P={...D},mode='sandbox',V={cx:0,cy:0,s:40},target=null,mi=0,msg='';

// ---------- analisis ----------
function analyze(t,p){
 if(t==='rat'&&ratForm!=='tf')return analyzeRat(p);
 const {a,h,k,b}=p,r={xi:[],yi:null,dom:'ℝ',ran:'ℝ',va:null,ha:null,pk:null};
 if(a===0){r.ran='y = '+fmt(k);r.yi=k;if(k===0)r.xi=['semua x'];return r}
 const up=a>0;
 if(t==='quad'){r.pk=[h,k];r.yi=a*h*h+k;const q=-k/a;if(q>=0)r.xi=q===0?[h]:[h-Math.sqrt(q),h+Math.sqrt(q)];r.ran=up?`y ≥ ${fmt(k)}`:`y ≤ ${fmt(k)}`;r.axis=h}
 if(t==='abs'){r.pk=[h,k];r.yi=a*Math.abs(h)+k;const q=-k/a;if(q>=0)r.xi=q===0?[h]:[h-q,h+q];r.ran=up?`y ≥ ${fmt(k)}`:`y ≤ ${fmt(k)}`}
 if(t==='rat'){r.va=h;r.ha=k;r.dom=`x ≠ ${fmt(h)}`;r.ran=`y ≠ ${fmt(k)}`;if(h!==0)r.yi=k-a/h;if(k!==0)r.xi=[h-a/k]}
 if(t==='irr'){r.pk=[h,k];r.dom=`x ≥ ${fmt(h)}`;r.ran=up?`y ≥ ${fmt(k)}`:`y ≤ ${fmt(k)}`;if(h<=0)r.yi=a*Math.sqrt(-h)+k;const q=-k/a;if(q>=0)r.xi=[h+q*q]}
 if(t==='exp'){r.ha=k;r.ran=up?`y > ${fmt(k)}`:`y < ${fmt(k)}`;r.yi=a*Math.pow(b,-h)+k;const q=-k/a;if(q>0)r.xi=[h+lg(q,b)]}
 if(t==='log'){r.va=h;r.dom=`x > ${fmt(h)}`;if(h<0)r.yi=a*lg(-h,b)+k;r.xi=[h+Math.pow(b,-k/a)]}
 return r;
}
const ft=v=>fmt(v).replace(',','{,}'),sg=v=>(v<0?'-':'+')+ft(Math.abs(v));
function setTex(e,t,d){try{e.innerHTML=katex.renderToString(t,{output:'mathml',displayMode:!!d,throwOnError:false})}catch(x){e.textContent=t}}
function renderTex(r){r.querySelectorAll('[data-tex]').forEach(e=>setTex(e,e.dataset.tex,e.dataset.d==='1'))}
const HT=t=>t.replace(/\$\$([^$]+)\$\$/g,(m,x)=>`<span data-tex="${x}" data-d="1"></span>`).replace(/\$([^$]+)\$/g,(m,x)=>`<span data-tex="${x}"></span>`);
const T2=t=>t.replace(/≥/g,'\\geq ').replace(/≤/g,'\\leq ').replace(/≠/g,'\\neq ').replace(/ℝ/g,'\\mathbb{R}').replace(/(\d),(\d)/g,'$1{,}$2');
const r2=v=>Math.round(v*100)/100;
function cf(a,body,dot){const A=Math.abs(a);return(a<0?'-':'')+(A===1?'':ft(A)+(dot?'\\cdot ':''))+body}
function texEq(){const {a,h,k,b}=P,X=h===0?'x':`x${sg(-h)}`,K=k===0?'':sg(k);
 if(type==='rat'&&ratForm==='gen')return `f(x)=\\dfrac{${polyTex([[P.ga,'x'],[P.gb,'']])}}{${polyTex([[P.gc,'x'],[P.gd,'']])}}`;
 if(type==='rat'&&ratForm==='adv')return `f(x)=\\dfrac{${polyTex([[P.qa,'x^{2}'],[P.qb,'x'],[P.qc,'']])}}{${polyTex([[P.qp,'x'],[P.qq,'']])}}`;
 if(a===0)return `f(x)=${ft(k)}`;
 if(type==='rat')return `f(x)=${a<0?'-':''}\\dfrac{${ft(Math.abs(a))}}{${X}}${K}`;
 const B=Number.isInteger(b)?ft(b):`\\left(${ft(b)}\\right)`;
 const body={quad:h===0?'x^{2}':`\\left(${X}\\right)^{2}`,abs:`\\left|${X}\\right|`,irr:`\\sqrt{${X}}`,exp:`${B}^{${X}}`,log:h===0?`\\log_{${ft(b)}}x`:`\\log_{${ft(b)}}\\left(${X}\\right)`}[type];
 return `f(x)=${cf(a,body,type==='exp'||type==='log')}${K}`}
function texStd(){const {a,h,k}=P,B=r2(-2*a*h),C=r2(a*h*h+k),tm=(v,t)=>v===0?'':(Math.abs(v)===1?(v<0?'-':'+'):sg(v))+t;
 return `f(x)=${cf(a,'x^{2}')}${tm(B,'x')}${C===0?'':sg(C)}`}
let eqMode='both';
function showEq(){const q=type==='quad'&&P.a!==0,m=q?eqMode:'vertex';
 setTex($('eq'),texEq());$('eq').classList.toggle('hidden',m==='std');
 $('eq2').classList.toggle('hidden',!(q&&m!=='vertex'));if(q)setTex($('eq2'),texStd());
 $('l1').classList.toggle('hidden',!(q&&m==='both'));$('l2').classList.toggle('hidden',!(q&&m!=='vertex'));
 $('eqmode').classList.toggle('hidden',type!=='quad');
 const rm=type==='rat'&&mode==='sandbox';$('ratmode').classList.toggle('hidden',!rm);$('ratcap').classList.toggle('hidden',!(rm&&ratForm!=='tf'));
 document.querySelectorAll('#ratmode .tab').forEach(e=>e.classList.toggle('on',e.dataset.m===ratForm));
 if(rm&&ratForm!=='tf'){$('ratcap').innerHTML=HT(ratForm==='gen'?'Bentuk umum $\\dfrac{ax+b}{cx+d}$: asimtot tegak dan datar.':'Mode lanjutan $\\dfrac{ax^2+bx+c}{px+q}$: asimtot tegak dan miring.');renderTex($('ratcap'))}
 document.querySelectorAll('#eqmode .tab').forEach(e=>e.classList.toggle('on',e.dataset.m===eqMode));
 const NM={ga:'a',gb:'b',gc:'c',gd:'d',qa:'a',qb:'b',qc:'c',qp:'p',qq:'q'};
 const raw='Parameter: '+list().map(([n])=>(NM[n]||n)+' = '+fmt(gv(n))).join(', ')+'  →  '+T[type].eq(P);
 $('eq').title=raw;$('eqraw').textContent=raw}
[['both','Ganda'],['vertex','Puncak'],['std','Standar']].forEach(([m,l])=>{const b=document.createElement('button');b.className='tab';b.dataset.m=m;b.textContent=l;b.style.fontSize='11px';b.onclick=()=>{eqMode=m;if(type==='quad'){buildSliders()}render()};$('eqmode').appendChild(b)});
$('eq').onclick=()=>$('eqraw').classList.toggle('hidden');
function render(){
 const A=analyze(type,P),M_=t=>`<span data-tex="${T2(t)}"></span>`,row=(l,v)=>`<div class="row"><span>${l}</span><b>${v}</b></div>`,pt=(x,y)=>M_(`(${fmt(x)},\\,${fmt(y)})`);
 showEq();
 let h=row('Domain',M_(A.dom))+row('Range',M_(A.ran));
 h+=row('Titik potong sumbu '+'$x$'.replace(/.*/,m=>HT(m)),A.xi.length?A.xi.map(v=>typeof v==='string'?v:pt(v,0)).join(' ; '):'tidak ada');
 h+=row('Titik potong sumbu '+HT('$y$'),A.yi===null?'tidak ada':pt(0,A.yi));
 if(A.pk)h+=row(type==='irr'?'Titik awal':'Titik puncak / sudut',pt(A.pk[0],A.pk[1]));
 if(A.axis!==undefined)h+=row('Sumbu simetri',M_(stdSl()?`x=-\\dfrac{b}{2a}=${fmt(A.axis)}`:`x=${fmt(A.axis)}`));
 if(type==='quad'&&P.a!==0){const D=r2(-4*P.a*P.k);h+=row('Koefisien bentuk standar',M_(`b=${fmt(r2(-2*P.a*P.h))},\;c=${fmt(r2(P.a*P.h*P.h+P.k))}`));h+=row('Diskriminan',M_(`D=${fmt(D)}`))+row('Banyak akar real',D>0?'dua, berbeda':D===0?'satu (kembar)':'tidak ada')}
 if(A.va!==null)h+=row('Asimtot tegak',M_(`x=${fmt(A.va)}`));
 if(A.ha!==null)h+=row('Asimtot datar',M_(`y=${fmt(A.ha)}`));
 if(['quad','abs','irr'].includes(type))h+=row('Arah',P.a>0?'terbuka ke atas':P.a<0?'terbuka ke bawah':'garis datar');
 if(type==='exp')h+=row('Jenis',P.b>1?'pertumbuhan':'peluruhan');
 if(A.sl)h+=row('Asimtot miring',M_(`y=${polyTex([[A.sl[0],'x'],[A.sl[1],'']])}`));
 if(A.hole)h+=row('Lubang (titik berlubang)',pt(A.hole[0],A.hole[1]));
 if(A.inv)h+=row('Fungsi invers',M_('f^{-1}(x)=\\dfrac{-dx+b}{cx-a}'))+row('Asimtot tegak f⁻¹',M_(`x=${fmt(A.ha)}`))+row('Asimtot datar f⁻¹',M_(`y=${fmt(A.va)}`));
 $('analysis').innerHTML=h+(A.err?`<p class="text-xs mt-2 p-2 rounded-lg" style="background:rgba(220,38,38,.14)">⚠ ${HT(A.err)}</p>`:'')+(A.note?`<p class="text-xs mt-2 p-2 rounded-lg" style="background:var(--bg)">ℹ ${HT(A.note)}</p>`:'');
 const d=[];
 d.push(P.h>0?`→ bergeser ${fmt(P.h)} satuan ke <b>kanan</b>`:P.h<0?`← bergeser ${fmt(-P.h)} satuan ke <b>kiri</b>`:'tidak bergeser horizontal');
 d.push(P.k>0?`↑ bergeser ${fmt(P.k)} satuan ke <b>atas</b>`:P.k<0?`↓ bergeser ${fmt(-P.k)} satuan ke <b>bawah</b>`:'tidak bergeser vertikal');
 if(P.a<0)d.push('↕ <b>dicerminkan</b> terhadap sumbu '+HT('$x$')+' ('+HT('$a<0$')+')');
 else if(Math.abs(P.a)>1)d.push('menyempit / curam ('+HT('$|a|>1$')+')');
 else if(P.a!==0)d.push('melebar / landai ('+HT('$|a|<1$')+')');
 $('shift').innerHTML='<b>Terhadap grafik induk:</b><br>'+d.join('<br>');$('shift').style.display=(type==='rat'&&ratForm!=='tf')?'none':'';
 renderTex($('analysis'));renderTex($('shift'));
 $('invWrap').classList.toggle('hidden',!invOK());
 draw(A);checkMode();renderTable();
}

// ---------- gambar ----------
const cv=$('cv'),ctx=cv.getContext('2d');
const col=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function fit(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);return r}
const X=x=>W/2+(x-V.cx)*V.s, Y=y=>H/2-(y-V.cy)*V.s;
let W=0,H=0;
function curve(t,p,color,w,dash){
 ctx.strokeStyle=color;ctx.lineWidth=w;ctx.setLineDash(dash||[]);ctx.beginPath();
 let pen=false,py=0,px0=null;const pl=t==='rat'?ratPole(p):null;
 for(let px=0;px<=W;px+=1){
  const x=V.cx+(px-W/2)/V.s,y=T[t].f(x,p);if(pl!==null&&px0!==null&&(px0<pl)!==(x<pl))pen=false;px0=x;
  if(!isFinite(y)||isNaN(y)){pen=false;continue}
  const sy=Y(y);
  if(Math.abs(sy)>1e5){pen=false;continue}
  if(pen&&Math.abs(sy-py)>H*1.2)pen=false;
  pen?ctx.lineTo(px,sy):ctx.moveTo(px,sy);pen=true;py=sy;
 }
 ctx.stroke();ctx.setLineDash([]);
}
function line(x1,y1,x2,y2,c,w,dash){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.setLineDash(dash||[]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([])}
function dot(x,y,c,lbl){ctx.fillStyle=c;ctx.beginPath();ctx.arc(X(x),Y(y),5,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
 if(lbl){ctx.fillStyle=col('--ink');ctx.font='11px Fira Code,monospace';ctx.fillText(lbl,X(x)+8,Y(y)-8)}}
function offArrow(px,py){const sx=X(px),sy=Y(py);if(sx>=0&&sx<=W&&sy>=0&&sy<=H)return;
 const m=22,dx=sx-W/2,dy=sy-H/2,t=Math.min((W/2-m)/Math.abs(dx||1e-9),(H/2-m)/Math.abs(dy||1e-9)),ex=W/2+dx*t,ey=H/2+dy*t;
 ctx.save();ctx.translate(ex,ey);ctx.rotate(Math.atan2(dy,dx));ctx.fillStyle='#dc2626';ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(-8,-8);ctx.lineTo(-8,8);ctx.closePath();ctx.fill();ctx.restore();
 ctx.fillStyle=col('--ink');ctx.font='11px Fira Code,monospace';ctx.fillText('puncak',Math.min(Math.max(ex-22,4),W-50),Math.min(Math.max(ey-12,12),H-4))}
function draw0(A){
 const r=fit();W=r.width;H=r.height;ctx.clearRect(0,0,W,H);
 const ink=col('--ink'),mut=col('--mut'),line0=col('--line');
 let st=1;while(st*V.s<45)st*=2;while(st*V.s>110)st/=2;if(st*V.s<45)st*=2.5;
 const x0=V.cx-W/2/V.s,x1=V.cx+W/2/V.s,y0=V.cy-H/2/V.s,y1=V.cy+H/2/V.s;
 ctx.font='10px Fira Code,monospace';ctx.fillStyle=mut;
 for(let x=Math.ceil(x0/st)*st;x<=x1;x+=st){line(X(x),0,X(x),H,line0,1);if(Math.abs(x)>1e-9){ctx.fillText(fmt(x),X(x)+2,Math.min(Math.max(Y(0)+12,12),H-3))}}
 for(let y=Math.ceil(y0/st)*st;y<=y1;y+=st){line(0,Y(y),W,Y(y),line0,1);if(Math.abs(y)>1e-9){ctx.fillText(fmt(y),Math.min(Math.max(X(0)+4,2),W-30),Y(y)-3)}}
 line(X(0),0,X(0),H,ink,1.6);line(0,Y(0),W,Y(0),ink,1.6);
 // domain

  const R='rgba(220,38,38,.18)';ctx.fillStyle=R;

let ratForm='tf';
function polyTex(ts){let o='';ts.forEach(([v,t])=>{v=r2(v);if(!v)return;const A=Math.abs(v),c=(A===1&&t)?'':ft(A);o+=(v<0?'-':(o?'+':''))+c+t});return o||'0'}
const invOK=()=>type==='exp'||type==='log'||(type==='rat'&&ratForm==='gen');
function ratPole(p=P){if(ratForm==='gen')return Math.abs(p.gc)<1e-9?null:-p.gd/p.gc;if(ratForm==='adv')return Math.abs(p.qp)<1e-9?null:-p.qq/p.qp;return p.h}
const undef=x=>{if(type!=='rat')return false;const pl=ratPole();return pl!==null&&Math.abs(x-pl)<1e-9};
function analyzeRat(p){
 const r={xi:[],yi:null,dom:'ℝ',ran:'ℝ',va:null,ha:null,pk:null},z=v=>Math.abs(v)<1e-9,bad='\\text{tidak terdefinisi}';
 if(ratForm==='gen'){const a=p.ga,b=p.gb,c=p.gc,d=p.gd;
  if(z(c)){if(z(d)){r.err='Penyebut tidak boleh bernilai $0$.';r.dom=bad;r.ran=bad;return r}
   r.note='Karena $c=0$, fungsi berubah menjadi fungsi linear.';r.yi=b/d;if(!z(a))r.xi=[-b/a];else{r.ran=`y = ${fmt(b/d)}`;if(z(b))r.xi=['semua x']}return r}
  const x0=-d/c,y0=a/c;r.dom=`x ≠ ${fmt(x0)}`;
  if(z(a*d-b*c)){r.note=`Karena $ad-bc=0$, fungsi menjadi konstan $y=${ft(y0)}$ dengan lubang di $x=${ft(x0)}$.`;r.hole=[x0,y0];r.ran=`y = ${fmt(y0)}`;if(z(y0))r.xi=['semua x ≠ '+fmt(x0)];if(!z(d))r.yi=b/d;return r}
  r.va=x0;r.ha=y0;r.ran=`y ≠ ${fmt(y0)}`;r.inv=true;if(!z(a))r.xi=[-b/a];if(!z(d))r.yi=b/d;return r}
 const a=p.qa,b=p.qb,c=p.qc,pp=p.qp,q=p.qq;
 if(z(pp)){if(z(q)){r.err='Penyebut tidak boleh bernilai $0$.';r.dom=bad;r.ran=bad;return r}
  r.note='Karena $p=0$, fungsi berubah menjadi fungsi kuadrat (atau linear).';r.yi=c/q;
  if(z(a)){if(!z(b))r.xi=[-c/b]}else{const Dd=b*b-4*a*c;if(Dd>=0){const sq=Math.sqrt(Dd);r.xi=Dd===0?[-b/(2*a)]:[(-b-sq)/(2*a),(-b+sq)/(2*a)]}}return r}
 const x0=-q/pp,m=a/pp,n=(b-m*q)/pp,R=c-n*q;r.dom=`x ≠ ${fmt(x0)}`;
 let rt=[];if(z(a)){if(!z(b))rt=[-c/b]}else{const Dd=b*b-4*a*c;if(Dd>=0){const sq=Math.sqrt(Dd);rt=Dd===0?[-b/(2*a)]:[(-b-sq)/(2*a),(-b+sq)/(2*a)]}}
 r.xi=rt.filter(v=>Math.abs(v-x0)>1e-9).sort((u,v)=>u-v);if(!z(q))r.yi=c/q;
 if(z(R)){r.hole=[x0,m*x0+n];r.note=`Pembilang habis dibagi penyebut: fungsi menjadi linear $y=${polyTex([[m,'x'],[n,'']])}$ dengan lubang di $x=${ft(x0)}$.`;r.ran=z(m)?`y = ${fmt(n)}`:`y ≠ ${fmt(m*x0+n)}`;return r}
 r.va=x0;
 if(z(a)){r.ha=n;r.ran=`y ≠ ${fmt(n)}`;r.note='Karena $a=0$, derajat pembilang sama dengan penyebut sehingga asimtotnya datar, bukan miring.';return r}
 r.sl=[m,n];const A2=pp*pp,B2=4*a*q-2*b*pp,C2=b*b-4*a*c,Dy=B2*B2-4*A2*C2;
 if(Dy<=1e-9)r.ran='ℝ';else{const sq=Math.sqrt(Dy);r.ran=`y ≤ ${fmt((-B2-sq)/(2*A2))} \\text{ atau } y ≥ ${fmt((-B2+sq)/(2*A2))}`}
 return r}
